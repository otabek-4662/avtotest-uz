<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C94C"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Hexagon -->
  <polygon points="256,40 450,148 450,364 256,472 62,364 62,148" stroke="url(#goldGrad)" stroke-width="16" fill="#11161D" filter="url(#glow)"/>

  <!-- Speedometer Decorative Arc -->
  <path d="M160 210 A120 120 0 0 1 352 210" stroke="url(#goldGrad)" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Needle -->
  <line x1="256" y1="260" x2="320" y2="180" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="260" r="14" fill="url(#goldGrad)"/>

  <!-- Text AT -->
  <text x="256" y="380" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-weight="900" font-size="130" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">AT</text>

  <!-- Subtitle -->
  <text x="256" y="425" font-family="'Inter', sans-serif" font-weight="700" font-size="24" fill="#9AA0A6" text-anchor="middle" letter-spacing="6">AVTOTEST UZ</text>
</svg>
