<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AvtoTest UZ — O'zbekiston PDD Imtihoni va Yo'l Harakati Qoidalari Portali</title>
  <meta name="description" content="O'zbekiston haydovchilik guvohnomasi imtihoniga tayyorlanish uchun to'liq qamrovli, zamonaviy veb-sayt. PDD testlar, yo'l belgilari, nazariya va jarimalar." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#0B0F14',
            surface: '#11161D',
            'surface-2': '#171C24',
            primary: '#F2C94C',
            danger: '#EB5757',
            text: '#E8EAED',
            'text-muted': '#9AA0A6',
            border: '#242B36'
          },
          fontFamily: {
            heading: ['Space Grotesk', 'sans-serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#F2C94C] selection:text-[#0B0F14]">

  <!-- Header / Technical Navigation Bar (Height: 80px) -->
  <header id="main-header" class="sticky top-0 z-50 tech-navbar transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full">
      <div class="flex items-center justify-between h-20">

        <!-- LOGO (Pure Geometric SVG Hexagon Monogram) -->
        <div class="flex items-center gap-3 cursor-pointer shrink-0" onclick="window.switchTab('home')">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="20,3 36,12 36,28 20,37 4,28 4,12" stroke="#F2C94C" stroke-width="2.5" fill="#11161D" />
            <text x="20" y="25" font-family="'Space Grotesk', monospace" font-weight="800" font-size="15" fill="#F2C94C" text-anchor="middle">AT</text>
          </svg>
          <div class="flex flex-col">
            <span class="text-xl font-extrabold tracking-tight text-[#E8EAED] font-heading leading-none">
              AvtoTest <span class="text-[#F2C94C]">UZ</span>
            </span>
            <span class="text-[10px] uppercase font-bold text-[#9AA0A6] tracking-wider mt-0.5">
              PDD Imtihon Portali
            </span>
          </div>
        </div>

        <!-- Desktop Navigation Links (Offset left ~10-15%) -->
        <nav class="hidden md:flex items-center gap-1 nav-menu-container">
          <button data-tab="home" onclick="window.switchTab('home')" class="nav-link nav-btn active">
            Bosh Sahifa
          </button>
          <button data-tab="test" onclick="window.switchTab('test')" class="nav-link nav-btn">
            Test Rejimi
          </button>
          <button data-tab="signs" onclick="window.switchTab('signs')" class="nav-link nav-btn">
            Yo'l Belgilari
          </button>
          <button data-tab="theory" onclick="window.switchTab('theory')" class="nav-link nav-btn">
            Nazariya
          </button>
          <button data-tab="fines" onclick="window.switchTab('fines')" class="nav-link nav-btn">
            Jarimalar
          </button>
          <button data-tab="stats" onclick="window.switchTab('stats')" class="nav-link nav-btn">
            Statistika
          </button>
          <button data-tab="profile" onclick="window.switchTab('profile')" id="nav-btn-profile" class="nav-link nav-btn hidden">
            Profil
          </button>
          <button data-tab="admin" onclick="window.switchTab('admin')" id="nav-btn-admin" class="nav-link nav-btn hidden text-[#EB5757]">
            Admin
          </button>
        </nav>

        <!-- Right Side Actions: GLOBAL SEARCH, LANGUAGE SWITCHER, AUTH & CTA -->
        <div class="flex items-center gap-3">
          
          <!-- FEATURE 3: GLOBAL NAVBAR SEARCH INPUT -->
          <div class="relative hidden lg:block w-44">
            <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-[#9AA0A6]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input 
              type="text" 
              id="global-search-input" 
              placeholder="Qidiruv..." 
              oninput="window.handleGlobalSearch(this.value)"
              class="w-full pl-9 pr-3 py-1.5 rounded-md bg-[#171C24] border border-[#242B36] text-[#E8EAED] text-xs focus:outline-none focus:border-[#F2C94C] transition-colors"
            />
          </div>

          <!-- FEATURE 2: SLEEK LANGUAGE SWITCHER (UZ / RU) -->
          <button id="btn-lang-toggle" onclick="window.toggleLanguage()" class="btn-secondary text-xs py-1.5 px-2.5 font-mono font-bold text-[#F2C94C] flex items-center gap-1 border border-[#242B36]" title="Tilni almashtirish / Сменить язык">
            <span id="current-lang-label">UZ</span>
            <svg class="w-3 h-3 text-[#9AA0A6]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </button>

          <!-- FEATURE 1: AUTHENTICATION BUTTONS (LOGIN & REGISTER) -->
          <div id="auth-nav-buttons" class="hidden sm:flex items-center gap-2">
            <button onclick="window.openAuthModal('login')" class="btn-secondary text-xs py-2 px-3">
              Kirish
            </button>
            <button onclick="window.openAuthModal('register')" class="btn-primary text-xs py-2 px-3.5">
              Ro'yxatdan o'tish
            </button>
          </div>

          <!-- Logged In User Pill (Hidden by default, JS sets display:flex when shown) -->
          <div id="user-profile-pill"
               class="hidden bg-[#171C24] border border-[#242B36] px-3 py-1.5 rounded-md text-xs relative overflow-hidden glass-panel hover-glow cursor-pointer"
               style="align-items:center; gap:8px;"
               onclick="window.switchTab('profile')">
            <span id="user-display-name" class="font-mono font-bold text-[#F2C94C]">Foydalanuvchi</span>
            <span id="pro-badge" class="hidden bg-gradient-to-r from-yellow-400 to-yellow-600 text-[#0B0F14] text-[10px] font-bold px-1.5 py-0.5 rounded pro-badge-glow">👑 PRO</span>
            <button onclick="event.stopPropagation(); window.logoutUser()" class="text-[#EB5757] hover:underline font-semibold">Chiqish</button>
          </div>

          <!-- Mobile Hamburger Menu Button -->
          <button id="btn-mobile-menu" class="md:hidden p-2 rounded-md bg-[#171C24] text-[#E8EAED] border border-[#242B36]">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
          </button>
        </div>

      </div>
    </div>

    <!-- Mobile Dropdown Navigation Menu -->
    <div id="mobile-menu" class="hidden md:hidden px-4 pb-4 border-b border-[#242B36] bg-[#0B0F14]/95 backdrop-blur-md">
      <div class="flex flex-col gap-1 pt-3">
        <button onclick="window.switchTab('home')" class="text-left px-4 py-3 rounded-lg text-sm font-semibold text-[#E8EAED] hover:bg-[#171C24]">
          Bosh Sahifa
        </button>
        <button onclick="window.switchTab('test')" class="text-left px-4 py-3 rounded-lg text-sm font-semibold text-[#E8EAED] hover:bg-[#171C24]">
          Test Rejimi
        </button>
        <button onclick="window.switchTab('signs')" class="text-left px-4 py-3 rounded-lg text-sm font-semibold text-[#E8EAED] hover:bg-[#171C24]">
          Yo'l Belgilari Katalogi
        </button>
        <button onclick="window.switchTab('theory')" class="text-left px-4 py-3 rounded-lg text-sm font-semibold text-[#E8EAED] hover:bg-[#171C24]">
          PDD Nazariya
        </button>
        <button onclick="window.switchTab('fines')" class="text-left px-4 py-3 rounded-lg text-sm font-semibold text-[#E8EAED] hover:bg-[#171C24]">
          Jarimalar Jadvali
        </button>
        <button onclick="window.switchTab('stats')" class="text-left px-4 py-3 rounded-lg text-sm font-semibold text-[#E8EAED] hover:bg-[#171C24]">
          Statistika va Progress
        </button>
        <button id="mobile-nav-profile" onclick="window.switchTab('profile')" class="hidden text-left px-4 py-3 rounded-lg text-sm font-semibold text-[#E8EAED] hover:bg-[#171C24]">
          Mening Profilim
        </button>
        <div id="mobile-auth-container" class="pt-2 border-t border-[#242B36] flex gap-2">
          <button onclick="window.openAuthModal('login')" class="btn-secondary w-full text-xs py-2">Kirish</button>
          <button onclick="window.openAuthModal('register')" class="btn-primary w-full text-xs py-2">Ro'yxatdan o'tish</button>
        </div>
        <div id="mobile-user-container" class="hidden pt-2 border-t border-[#242B36] flex-col gap-2">
          <span class="text-xs text-[#9AA0A6] px-4 font-mono">Tizimga kirilgan: <span id="mobile-user-name" class="text-[#F2C94C] font-bold"></span></span>
          <button onclick="window.logoutUser()" class="btn-secondary w-full text-xs py-2 text-[#EB5757] border-[#EB5757]">Chiqish</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="app-main-content">
      <!-- Dynamic views injected here -->
    </div>
  </main>

  <!-- FEATURE 4: MODERN FOOTER WITH PRIVACY POLICY, TERMS OF SERVICE & TELEGRAM LINK -->
  <footer class="border-t border-[#242B36] bg-[#0B0F14] mt-16 py-10 text-[#9AA0A6] text-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6">
      
      <div class="flex flex-col md:flex-row items-center justify-between gap-6 pb-6 border-b border-[#242B36]">
        
        <!-- Left Footer Brand -->
        <div class="flex items-center gap-3">
          <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="20,3 36,12 36,28 20,37 4,28 4,12" stroke="#F2C94C" stroke-width="2.5" fill="#11161D" />
            <text x="20" y="25" font-family="'Space Grotesk', monospace" font-weight="800" font-size="15" fill="#F2C94C" text-anchor="middle">AT</text>
          </svg>
          <div>
            <span class="font-bold text-[#E8EAED] font-heading text-sm block">AvtoTest UZ</span>
            <span class="text-[#9AA0A6] text-[11px]">O'zbekiston Yo'l Harakati Qoidalari va Imtihon Portali</span>
          </div>
        </div>

        <!-- Center / Right Links: Privacy Policy, Terms, Telegram -->
        <div class="flex items-center flex-wrap gap-6 text-xs font-medium">
          <a href="#" onclick="alert('Maxfiylik Siyosati:\nFoydalanuvchi ma’lumotlari xavfsiz saqlanadi hamda uchinchi shaxslarga berilmaydi.'); return false;" class="hover:text-[#F2C94C] transition-colors">
            Maxfiylik Siyosati
          </a>
          <span class="text-[#242B36]">•</span>
          <a href="#" onclick="alert('Foydalanish Shartlari:\nPlatforma O‘zbekiston PDD imtihoniga tayyorlanish uchun mo’ljallangan o’quv-interaktiv simulyatsiya hisoblanadi.'); return false;" class="hover:text-[#F2C94C] transition-colors">
            Foydalanish Shartlari
          </a>
          <span class="text-[#242B36]">•</span>
          <a href="https://t.me/otabek_dev" target="_blank" class="hover:text-[#F2C94C] transition-colors flex items-center gap-1.5 text-[#E8EAED] bg-[#171C24] px-3 py-1.5 rounded border border-[#242B36]">
            <svg class="w-4 h-4 text-[#F2C94C]" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-1.97 9.28c-.15.65-.53.81-1.07.5l-3-2.21-1.45 1.39c-.16.16-.3.3-.61.3l.21-3.05 5.56-5.02c.24-.22-.05-.34-.37-.13l-6.87 4.33-2.96-.92c-.64-.2-.65-.64.13-.95l11.57-4.46c.54-.19 1.01.13.84.95z"/>
            </svg>
            <span>Telegram Aloqa</span>
          </a>
        </div>

      </div>

      <!-- Copyright Line -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-2 text-[11px] text-[#9AA0A6]">
        <p>© 2026 AvtoTest UZ. Barcha huquqlar himoyalangan.</p>
        <p>Tayyorgarlik tizimi va PDD simulyatsiyasi.</p>
      </div>

    </div>
  </footer>

  <!-- FEATURE 1: AUTH MODAL WINDOW (LOGIN & REGISTER FORMS MATCHING YELLOW/DARK THEME) -->
  <div id="auth-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0B0F14]/90 backdrop-blur-md hidden fade-in">
    <div class="tech-card p-8 max-w-md w-full relative border border-[#242B36] shadow-2xl">
      
      <!-- Close Button -->
      <button onclick="window.closeAuthModal()" class="absolute top-4 right-4 w-8 h-8 rounded-md bg-[#171C24] text-[#9AA0A6] hover:text-[#E8EAED] flex items-center justify-center text-sm font-bold border border-[#242B36]">
        ✕
      </button>

      <!-- Auth Tab Header Switcher -->
      <div class="flex items-center gap-2 mb-6 border-b border-[#242B36] pb-3">
        <button id="tab-login-btn" onclick="window.switchAuthTab('login')" class="text-lg font-bold font-heading text-[#F2C94C] border-b-2 border-[#F2C94C] pb-1 mr-4 transition-all">
          Kirish
        </button>
        <button id="tab-register-btn" onclick="window.switchAuthTab('register')" class="text-lg font-bold font-heading text-[#9AA0A6] hover:text-[#E8EAED] pb-1 transition-all">
          Ro'yxatdan o'tish
        </button>
      </div>

      <!-- Status Message Area -->
      <div id="auth-status-msg" class="hidden mb-4 p-3 rounded-md text-xs font-semibold"></div>

      <!-- LOGIN FORM -->
      <form id="login-form" onsubmit="window.handleLoginSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-mono font-bold text-[#9AA0A6] uppercase mb-1" data-i18n="label-username-phone">Foydalanuvchi nomi yoki Telefon raqam</label>
          <input 
            type="text" 
            id="login-username" 
            required 
            placeholder="masalan: otabek yoki +998901234567" 
            class="w-full px-4 py-2.5 rounded-md bg-[#0B0F14] border border-[#242B36] text-[#E8EAED] text-sm focus:outline-none focus:border-[#F2C94C] transition-colors"
          />
        </div>
        <div>
          <label class="block text-xs font-mono font-bold uppercase mb-1" style="color:var(--text-muted)" data-i18n="label-password">Parol</label>
          <div class="relative">
            <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-2.5 pr-10 rounded-md text-sm focus:outline-none transition-colors" style="background:var(--bg);border:1px solid var(--border);color:var(--text)" />
            <button type="button" onclick="window.togglePasswordVisibility('login-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 focus:outline-none p-1 transition-colors hover:opacity-80" style="color:var(--text-muted)" title="Parolni ko'rsatish">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-primary w-full py-3 text-sm mt-2">
          <span>Kirish</span>
        </button>
      </form>

      <!-- REGISTER FORM (Hidden by default) -->
      <form id="register-form" onsubmit="window.handleRegisterSubmit(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-mono font-bold text-[#9AA0A6] uppercase mb-1" data-i18n="label-username">Foydalanuvchi nomi</label>
          <input 
            type="text" 
            id="reg-username" 
            required 
            placeholder="masalan: otabek" 
            class="w-full px-4 py-2.5 rounded-md bg-[#0B0F14] border border-[#242B36] text-[#E8EAED] text-sm focus:outline-none focus:border-[#F2C94C] transition-colors"
          />
        </div>
        <div>
          <label class="block text-xs font-mono font-bold text-[#9AA0A6] uppercase mb-1" data-i18n="label-phone">Telefon Raqami</label>
          <input 
            type="tel" 
            id="reg-phone" 
            required 
            placeholder="+998 90 123 45 67" 
            class="w-full px-4 py-2.5 rounded-md bg-[#0B0F14] border border-[#242B36] text-[#E8EAED] text-sm focus:outline-none focus:border-[#F2C94C] transition-colors"
          />
        </div>
        <div>
          <label class="block text-xs font-mono font-bold uppercase mb-1" style="color:var(--text-muted)" data-i18n="label-password">Parol</label>
          <div class="relative">
            <input type="password" id="reg-password" required placeholder="••••••••" class="w-full px-4 py-2.5 pr-10 rounded-md text-sm focus:outline-none transition-colors" style="background:var(--bg);border:1px solid var(--border);color:var(--text)" />
            <button type="button" onclick="window.togglePasswordVisibility('reg-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 focus:outline-none p-1 transition-colors hover:opacity-80" style="color:var(--text-muted)" title="Parolni ko'rsatish">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-primary w-full py-3 text-sm mt-2">
          <span>Ro'yxatdan o'tish</span>
        </button>
      </form>

    </div>
  </div>

  <!-- Scripts -->
  <script src="./data/questions.js"></script>
  <script src="./data/signs.js"></script>
  <script src="./data/theory.js"></script>
  <script src="./data/fines.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/test.js"></script>
  <script src="./js/signs.js"></script>
  <script src="./js/theory.js"></script>
  <script src="./js/fines.js"></script>
  <script src="./js/stats.js"></script>
  <script src="./js/pro-games.js"></script>
  <script src="./js/profile.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
